<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src chrome:; img-src chrome: data:; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-l10n="title">Новая вкладка</title>

<!-- Никаких внешних ресурсов: шрифты системные, иконки локальные, значки
     сайтов браузер берёт из своей истории. Страница не делает ни одного
     сетевого запроса — иначе браузер сообщает о вашем запуске раньше,
     чем вы что-то открыли. -->
<link rel="stylesheet" href="chrome://browser/content/vantara/newtab/tokens.css">
<link rel="stylesheet" href="chrome://browser/content/vantara/newtab/animations.css">
<link rel="stylesheet" href="chrome://browser/content/vantara/newtab/newtab.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="vn-sprite" aria-hidden="true">
  <symbol id="vn-back" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Назад</title><path d="M10 3 5 8l5 5"/></symbol>
  <symbol id="vn-forward" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Вперёд</title><path d="m6 3 5 5-5 5"/></symbol>
  <symbol id="vn-reload" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Обновить</title><path d="M13.25 8.5a5.25 5.25 0 1 1-1.54-3.71"/><path d="M12.625 2v3.625H9"/></symbol>
  <symbol id="vn-stop" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Остановить</title><path d="m4 4 8 8M12 4l-8 8"/></symbol>
  <symbol id="vn-home" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Домой</title><path d="M1.75 7.5 8.125 2.125 14.5 7.5"/><path d="M3.625 6.25v7.375h9V6.25"/></symbol>
  <symbol id="vn-shield" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Щит: защита активна</title><path d="M8.125 1.625 13.625 3.625v4.25c0 3.25-2.25 5.75-5.5 6.625-3.25-.875-5.5-3.375-5.5-6.625v-4.25z"/><path d="m6 6.5 4.25 4.25M10.25 6.5 6 10.75"/></symbol>
  <symbol id="vn-shield-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Щит: защита снята</title><path d="M8.125 1.625 13.625 3.625v4.25c0 3.25-2.25 5.75-5.5 6.625-3.25-.875-5.5-3.375-5.5-6.625v-4.25z"/><path d="M5.625 8.625h5"/></symbol>
  <symbol id="vn-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Соединение защищено</title><rect x="3.625" y="7.625" width="9" height="6" rx="1.5"/><path d="M5.625 7.625V5.5a2.5 2.5 0 0 1 5 0v2.125"/></symbol>
  <symbol id="vn-lock-open" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Соединение не защищено</title><rect x="3.625" y="7.625" width="9" height="6" rx="1.5"/><path d="M5.625 7.625V5.5a2.5 2.5 0 0 1 4.8-1"/></symbol>
  <symbol id="vn-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Новая вкладка</title><path d="M7.625 2.125v11M2.125 7.625h11"/></symbol>
  <symbol id="vn-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Закрыть</title><path d="m4 4 8 8M12 4l-8 8"/></symbol>
  <symbol id="vn-window-min" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Свернуть</title><path d="M3.625 7.625h9"/></symbol>
  <symbol id="vn-window-max" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Развернуть</title><rect x="3.625" y="3.625" width="9" height="9" rx="1.5"/></symbol>
  <symbol id="vn-window-restore" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Восстановить</title><rect x="2.625" y="5.625" width="8" height="8" rx="1.5"/><path d="M5.625 2.625h6.5a1.5 1.5 0 0 1 1.5 1.5v6.5"/></symbol>
  <symbol id="vn-window-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Закрыть окно</title><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="vn-sidebar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Боковая панель</title><rect x="1.625" y="2.625" width="12" height="11" rx="1.75"/><path d="M5.625 2.625v11"/></symbol>
  <symbol id="vn-split" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Разделить экран</title><rect x="1.625" y="2.625" width="12" height="11" rx="1.75"/><path d="M7.625 2.625v11"/></symbol>
  <symbol id="vn-chevron-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Список вкладок</title><path d="M3.5 6 8 10.5 12.5 6"/></symbol>
  <symbol id="vn-group" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Группа вкладок</title><rect x="1.625" y="4.625" width="12" height="7" rx="2"/><path d="M5.625 4.625v7M9.625 4.625v7"/></symbol>
  <symbol id="vn-pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Закрепить</title><path d="M5.625 2.625h4l-.5 4 2 2h-7l2-2z"/><path d="M7.625 8.625v5.25"/></symbol>
  <symbol id="vn-menu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Меню</title><path d="M2.5 3.625h10.25M2.5 7.625h10.25M2.5 11.625h10.25"/></symbol>
  <symbol id="vn-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Поиск</title><circle cx="7" cy="7" r="4.625"/><path d="m10.5 10.5 3.5 3.5"/></symbol>
  <symbol id="vn-download" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Загрузки</title><path d="M7.625 2v7.5M4.5 6.5l3.125 3.125L10.75 6.5"/><path d="M2.625 13.625h10"/></symbol>
  <symbol id="vn-palette" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Оформление</title><path d="M8 2.8c-2.93 0-5.33 2.27-5.33 5.2s2.4 5.2 5.33 5.2c.8 0 1.2-.47 1.2-1.07 0-.33-.2-.6-.33-.87-.2-.27-.33-.53-.33-.87 0-.6.47-1.07 1.07-1.07h1.27c1.4 0 2.47-1.13 2.47-2.53 0-2.2-2.4-4-5.33-4z"/><circle cx="5.33" cy="7.67" r=".6"/><circle cx="7.07" cy="5.33" r=".6"/><circle cx="9.87" cy="5.67" r=".6"/></symbol>
  <symbol id="vn-journal" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Журнал запросов</title><path d="M2.625 3.625h5.5M2.625 7.625h4M2.625 11.625h5.5"/><path d="m10.125 5.125 2.5 2.5-2.5 2.5"/></symbol>
  <symbol id="vn-extensions" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Расширения</title><path d="M3.625 5.625h3v-2h2v2h3v2h2v3h-2v3h-8z"/></symbol>
  <symbol id="vn-history" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>История</title><path d="M2.425 8a5.2 5.2 0 1 0 1.6-3.73"/><path d="M2.625 3v3.125h3"/><path d="M7.625 5v3.125l2 1.25"/></symbol>
  <symbol id="vn-settings" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Настройки</title><path d="M2.5 4.625h5M11.75 4.625h1.75"/><path d="M2.5 11.625h1.75M8.5 11.625h5"/><circle cx="9.625" cy="4.625" r="1.75"/><circle cx="6.375" cy="11.625" r="1.75"/></symbol>
  <symbol id="vn-bookmark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Закладка</title><path d="M4.625 2.625h7v10.75l-3.5-2.75-3.5 2.75z"/></symbol>
  <symbol id="vn-bookmark-on" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="1.25"><title>Закладка сохранена</title><path d="M4.625 2.625h7v10.75l-3.5-2.75-3.5 2.75z"/></symbol>
  <symbol id="vn-star" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>В избранное</title><path d="m8 2.67 1.73 3.6 3.93.53-2.87 2.73.67 3.93L8 11.6 4.53 13.47l.67-3.93-2.87-2.73 3.93-.53L8 2.67z"/></symbol>
  <symbol id="vn-star-on" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="1.25"><title>В избранном</title><path d="m8 2.67 1.73 3.6 3.93.53-2.87 2.73.67 3.93L8 11.6 4.53 13.47l.67-3.93-2.87-2.73 3.93-.53L8 2.67z"/></symbol>
  <symbol id="vn-private" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Приватное окно</title><path d="M1.75 8.625h12.5"/><path d="M3.625 8.625 4.75 4.625h6.5l1.125 4"/><circle cx="5.25" cy="11.25" r="1.75"/><circle cx="10.75" cy="11.25" r="1.75"/></symbol>
  <symbol id="vn-eye-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"><title>Скрыто</title><path d="M2.67 8s2.13-3.67 5.33-3.67c1 0 1.87.33 2.6.8"/><path d="M12.4 6.27A8.67 8.67 0 0 1 13.33 8s-2.13 3.67-5.33 3.67c-.67 0-1.27-.13-1.8-.33"/><path d="M3.33 12.67 12.67 3.33"/></symbol>
</svg>

<main class="page">

  <!-- Оформление: схема и палитра -->
  <div class="theme">
    <button type="button" class="theme-toggle" id="theme-toggle"
            aria-expanded="false" aria-controls="theme-popover"
            title="Оформление" data-l10n-attrs="title:themeTitle">
      <svg class="icon" aria-hidden="true">
        <use href="#vn-palette"/>
      </svg>
    </button>

    <div class="theme-popover" id="theme-popover" hidden>
      <p class="theme-heading" data-l10n="themeTitle">Оформление</p>

      <div class="modes" role="radiogroup" aria-label="Схема"
           data-l10n-attrs="aria-label:modeLabel">
        <button type="button" role="radio" data-mode="system" data-l10n="modeSystem">Как в системе</button>
        <button type="button" role="radio" data-mode="light" data-l10n="modeLight">Светлая</button>
        <button type="button" role="radio" data-mode="dark" data-l10n="modeDark">Тёмная</button>
      </div>

      <div class="palettes" role="radiogroup" aria-label="Палитра"
           data-l10n-attrs="aria-label:paletteLabel">
        <button type="button" role="radio" data-palette="forge">
          <span class="chip" aria-hidden="true"><span class="chip-bar"></span><span class="chip-text"></span><span class="chip-accent"></span></span><span data-l10n="paletteForge">Кузница</span>
        </button>
        <button type="button" role="radio" data-palette="midnight">
          <span class="chip" aria-hidden="true"><span class="chip-bar"></span><span class="chip-text"></span><span class="chip-accent"></span></span><span data-l10n="paletteMidnight">Полночь</span>
        </button>
        <button type="button" role="radio" data-palette="pine">
          <span class="chip" aria-hidden="true"><span class="chip-bar"></span><span class="chip-text"></span><span class="chip-accent"></span></span><span data-l10n="palettePine">Хвоя</span>
        </button>
        <button type="button" role="radio" data-palette="ash">
          <span class="chip" aria-hidden="true"><span class="chip-bar"></span><span class="chip-text"></span><span class="chip-accent"></span></span><span data-l10n="paletteAsh">Пепел</span>
        </button>
        <button type="button" role="radio" data-palette="amber">
          <span class="chip" aria-hidden="true"><span class="chip-bar"></span><span class="chip-text"></span><span class="chip-accent"></span></span><span data-l10n="paletteAmber">Янтарь</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Поиск: выше геометрического центра, по правилу третей -->
  <section class="hero">
    <img class="brand" src="chrome://browser/content/vantara/newtab/mark.png" alt="Vantara" width="84" height="84">

    <form class="search" id="search" role="search" autocomplete="off">
      <svg class="icon" aria-hidden="true">
        <use href="#vn-search"/>
      </svg>
      <input type="text" id="q" placeholder="Поиск или адрес" aria-label="Поиск или адрес"
             data-l10n-attrs="placeholder:search, aria-label:search"
             spellcheck="false" autocomplete="off">
      <button type="button" class="engine" id="engine"
              title="Сменить поисковую систему"
              data-l10n-attrs="title:engineSwitch">Google</button>
    </form>
  </section>

  <!-- Подсказка пропадает, как только в истории появился первый сайт -->
  <p class="empty" id="hint" data-l10n="hint" hidden>
    Здесь появятся избранные сайты и те, что вы открывали.
  </p>

  <section class="shelf" aria-labelledby="favorites-title">
    <h2 class="shelf-title" id="favorites-title" data-l10n="favorites">Избранное</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="shelf" id="history-shelf" aria-labelledby="history-title" hidden>
    <h2 class="shelf-title" id="history-title" data-l10n="recent">Недавно посещённые</h2>
    <div class="tiles" id="history"></div>
  </section>

</main>

<!-- Диалог добавления ссылки -->
<dialog class="modal" id="dialog">
  <form method="dialog" id="tile-form">
    <h2 id="dialog-title" data-l10n="dialogTitle">Новая ссылка</h2>

    <label for="tile-url" data-l10n="fieldUrl">Адрес</label>
    <input type="text" id="tile-url" placeholder="example.com" spellcheck="false" required>

    <label for="tile-name" data-l10n="fieldName">Название</label>
    <input type="text" id="tile-name" placeholder="необязательно" spellcheck="false"
           data-l10n-attrs="placeholder:fieldNameHint">

    <div class="actions">
      <button type="button" class="btn ghost" id="cancel" data-l10n="cancel">Отмена</button>
      <button type="submit" class="btn primary" data-l10n="save">Сохранить</button>
    </div>
  </form>
</dialog>

<script type="module" src="chrome://browser/content/vantara/newtab/newtab.js"></script>
</body>
</html>
